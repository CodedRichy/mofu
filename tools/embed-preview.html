<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>mofu embed preview</title>
<style>
  :root {
    --bg: #313338; --embed: #2b2d31; --text: #dbdee1; --muted: #949ba4; --link: #00a8fc;
    --btn: #4e5058; --btn-green: #248046; --btn-red: #da373c; --btn-blue: #5865f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #1e1f22; color: var(--text); font: 16px/1.375 'gg sans', 'Segoe UI', system-ui, sans-serif; }
  header { padding: 20px clamp(16px, 4vw, 40px); border-bottom: 1px solid #3f4147; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header span { color: var(--muted); font-size: 14px; }
  main { max-width: 760px; margin: 0 auto; padding: 24px clamp(12px, 3vw, 24px) 80px; display: grid; gap: 28px; }
  .scene h2 { margin: 0 0 2px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .scene .note { margin: 0 0 10px; font-size: 12px; color: #6d7078; font-family: ui-monospace, Consolas, monospace; }
  .msg { background: var(--bg); border-radius: 8px; padding: 10px 16px 14px 72px; position: relative; min-height: 60px; }
  .av { position: absolute; left: 16px; top: 12px; width: 40px; height: 40px; border-radius: 50%; background: #6366f1; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
  .who { font-weight: 500; font-size: 16px; line-height: 1.375; }
  .who time { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .app { font-size: 10px; background: var(--btn-blue); color: #fff; border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; line-height: 15px; display: inline-block; font-weight: 500; }
  .embed { margin-top: 2px; background: var(--embed); border: 1px solid rgba(255,255,255,.04); border-left: 4px solid #fff; border-radius: 4px; padding: 8px 16px 16px 12px; max-width: 520px; width: fit-content; min-width: 0; display: grid; position: relative; }
  .embed.has-thumb { grid-template-columns: minmax(0,1fr) 80px; column-gap: 16px; }
  .main { display: grid; gap: 8px; min-width: 0; }
  .thumb { width: 80px; height: 80px; border-radius: 4px; background: #3a3c42 center/cover; margin-top: 8px; }
  .e-author { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-top: 8px; }
  .e-author img, .e-foot img { width: 24px; height: 24px; border-radius: 50%; }
  .e-title { font-size: 16px; font-weight: 600; margin-top: 8px; }
  .e-desc { font-size: 14px; line-height: 1.375; white-space: pre-wrap; overflow-wrap: anywhere; }
  .fields { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; }
  .field { grid-column: span 12; font-size: 14px; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .field.inline { grid-column: span 4; }
  .field b.n { display: block; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .e-img { max-width: 100%; border-radius: 4px; margin-top: 8px; }
  .e-foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 8px; }
  .e-foot img { width: 20px; height: 20px; }
  a { color: var(--link); text-decoration: none; }
  code { background: #1e1f22; border-radius: 3px; padding: 0 4px; font: 85% ui-monospace, Consolas, monospace; }
  pre { background: #1e1f22; border: 1px solid #1a1b1e; border-radius: 4px; padding: 7px 9px; margin: 6px 0 0; font: 14px/1.2 ui-monospace, Consolas, monospace; overflow-x: auto; white-space: pre; }
  .mention { background: rgba(88,101,242,.3); color: #c9cdfb; border-radius: 3px; padding: 0 2px; font-weight: 500; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .btn { background: var(--btn); color: #fff; font-size: 14px; font-weight: 500; border-radius: 3px; padding: 2px 16px; height: 32px; min-width: 60px; justify-content: center; display: inline-flex; align-items: center; gap: 6px; }
  .btn.s3 { background: var(--btn-green); } .btn.s4 { background: var(--btn-red); } .btn.s1 { background: var(--btn-blue); }
  .btn[data-disabled="1"] { opacity: .5; }
  .fail { color: #f23f42; font-size: 13px; }
  .lint { margin: 8px 0 0; font: 12px ui-monospace, Consolas, monospace; color: #f0b232; }
</style>
</head>
<body>

ail":{"url":"https://cdn.discordapp.com/embed/avatars/0.png"},"description":"\u003c@9>\n**LEVEL UP**  13 -> **14**\n▰▱▱▱▱▱▱▱▱▱ 12%"}],"components":[]}]},{"title":"Level up (milestone)","note":"levels 10/25/50/100","messages":[{"embeds":[{"color":16777215,"footer":{"text":"mofu","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"timestamp":"2026-11-07T20:52:58.921Z","thumbnail":{"url":"https://cdn.discordapp.com/embed/avatars/0.png"},"description":"\u003c@9>\n**MILESTONE**\n**LEVEL UP**  24 -> **25**\n▰▰▰▰▱▱▱▱▱▱ 40%"}],"components":[]}]},{"title":"Error card","note":"REAL builder: errorCard in src/utils/embed.js","messages":[{"embeds":[{"color":16281969,"footer":{"text":"ref f34py1 - mofu","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"timestamp":"2026-11-07T20:52:58.921Z","description":"**Could not join voice**\nJoin a voice channel first, then run the command again."}],"components":[]}]},{"title":"Permission denied (known perms)","note":"REAL builder: permissionDenied in src/utils/embed.js (stub command)","messages":[{"embeds":[{"color":16281969,"footer":{"text":"mofu","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"timestamp":"2026-11-07T20:52:58.922Z","description":"**Missing permission**\nYou need Kick Members and Ban Members for /ban. Ask an admin for a role with it."}],"components":[]}]},{"title":"Permission denied (generic)","note":"REAL builder: permissionDenied, no permission bits","messages":[{"embeds":[{"color":16281969,"footer":{"text":"mofu","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"timestamp":"2026-11-07T20:52:58.922Z","description":"**Missing permission**\nYou do not have permission to use this command. Ask an admin for access."}],"components":[]}]},{"title":"Rank","note":"MOCK mirrored from src/commands/leveling/rank.js (builder not exported; uses real base/bar/fmt)","messages":[{"embeds":[{"color":16777215,"footer":{"text":"mofu","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"timestamp":"2026-11-07T20:52:58.922Z","author":{"name":"member#0001","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"thumbnail":{"url":"https://cdn.discordapp.com/embed/avatars/0.png"},"description":"**Rank** #3 of 1,204\n**Level** 14\n**XP** 1,860 / 3,000\n\n▰▰▰▰▰▰▰▱▱▱▱▱ **62%**\n1,140 XP to level 15"}],"components":[]}]},{"title":"Slots: spinning","note":"MOCK mirrored from src/commands/economy/slots.js (stage() is inline)","messages":[{"embeds":[{"color":16777215,"footer":{"text":"mofu","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"timestamp":"2026-11-07T20:52:58.933Z","author":{"name":"Slots","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"description":"```\n+-----------+\n| 🌀 🌀 🌀 |\n+-----------+\n```\nBet **⌬ 500** - spinning..."}],"components":[]}]},{"title":"Slots: win","note":"MOCK mirrored from slots.js","messages":[{"embeds":[{"color":2278750,"footer":{"text":"mofu","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"timestamp":"2026-11-07T20:52:58.934Z","author":{"name":"Slots","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"description":"```\n+-----------+\n| 💎 💎 💎 |\n+-----------+\n```\nYou won **⌬ 2,500** (5x)\n**Wallet** `⌬ 9,100`"}],"components":[]}]},{"title":"Slots: jackpot","note":"MOCK mirrored from slots.js","messages":[{"embeds":[{"color":2278750,"footer":{"text":"mofu","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"timestamp":"2026-11-07T20:52:58.934Z","author":{"name":"Slots","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"description":"```\n+-----------+\n| 7️⃣ 7️⃣ 7️⃣ |\n+-----------+\n```\n**JACKPOT!** Triple sevens.\nYou won **⌬ 5,000** (10x)\n**Wallet** `⌬ 11,600`"}],"components":[]}]},{"title":"Slots: loss","note":"MOCK mirrored from slots.js","messages":[{"embeds":[{"color":16281969,"footer":{"text":"mofu","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"timestamp":"2026-11-07T20:52:58.934Z","author":{"name":"Slots","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"description":"```\n+-----------+\n| 🍒 🍋 🍇 |\n+-----------+\n```\nYou lost **⌬ 500**\n**Wallet** `⌬ 6,600`"}],"components":[]}]},{"title":"AI action proposal","note":"REAL builder: proposalCard in src/ai/actions.js (exported as _cards)","messages":[{"embeds":[{"color":16498468,"footer":{"text":"mofu","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"timestamp":"2026-11-07T20:52:58.947Z","author":{"name":"AI ACTION PROPOSAL","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"fields":[{"name":"Command","value":"```\n/mute @spammer 10m spamming links in #general\n```"},{"name":"Reason","value":"spamming links in #general"},{"name":"Target","value":"\u003c@1> - Member","inline":true},{"name":"Who can confirm","value":"Only \u003c@2> (needs Moderate Members)","inline":true},{"name":"Expires","value":"\u003ct:1794084838:R>","inline":true}]}],"components":[{"type":1,"components":[{"type":2,"style":4,"label":"Mute"},{"type":2,"style":2,"label":"Cancel"}]}]}]},{"title":"AI result card","note":"REAL builder: resultCard in src/ai/actions.js (exported as _cards)","messages":[{"embeds":[{"color":2278750,"footer":{"text":"via mofu AI","icon_url":"https://cdn.discordapp.com/embed/avatars/0.png"},"timestamp":"2026-11-07T20:52:58.947Z","author":{"name":"Muted"},"description":"**Action** mute\n**Target** \u003c@1>\n**Duration** 10 minutes"}],"components":[]}]}];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Enough Discord markdown to judge a layout: code blocks, inline code, bold, italics, links, mentions, relative times.
function md(s) {
  let out = esc(s);
  const blocks = [];
  out = out.replace(/```(?:\w+\n)?\n?([\s\S]*?)\n?```/g, (_, c) => { blocks.push(c); return `\u0000${blocks.length - 1}\u0000`; });
  out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
    .replace(/&lt;@!?(\d+)&gt;/g, '<span class="mention">@user</span>')
    .replace(/&lt;t:(\d+):[a-zA-Z]&gt;/g, '<span class="mention">in 2 minutes</span>');
  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre>${blocks[i]}</pre>`);
}

function embedHtml(e) {
  const color = '#' + (e.color ?? 0x202225).toString(16).padStart(6, '0');
  const main = [];
  if (e.author) main.push(`<div class="e-author">${e.author.icon_url ? `<img src="${esc(e.author.icon_url)}" alt="">` : ''}<span>${esc(e.author.name)}</span></div>`);
  if (e.title) main.push(`<div class="e-title">${e.url ? `<a href="${esc(e.url)}">${md(e.title)}</a>` : md(e.title)}</div>`);
  if (e.description) main.push(`<div class="e-desc">${md(e.description)}</div>`);
  if (e.fields?.length) main.push(`<div class="fields">${e.fields.map((f) => `<div class="field ${f.inline ? 'inline' : ''}"><b class="n">${md(f.name)}</b>${md(f.value)}</div>`).join('')}</div>`);
  if (e.image) main.push(`<img class="e-img" src="${esc(e.image.url)}" alt="">`);
  if (e.footer || e.timestamp) main.push(`<div class="e-foot">${e.footer?.icon_url ? `<img src="${esc(e.footer.icon_url)}" alt="">` : ''}<span>${esc(e.footer?.text || '')}${e.footer && e.timestamp ? ' • ' : ''}${e.timestamp ? 'Today at 4:20 PM' : ''}</span></div>`);
  const thumb = e.thumbnail ? `<div class="thumb" style="background-image:url('${esc(e.thumbnail.url)}')"></div>` : '';
  return `<div class="embed ${e.thumbnail ? 'has-thumb' : ''}" style="border-left-color:${color}"><div class="main">${main.join('')}</div>${thumb}</div>`;
}

// Cheap design lint: flags things that read badly in real Discord.
function lint(e) {
  const w = [];
  if ((e.title || '').length > 256) w.push('title >256');
  if ((e.description || '').length > 4096) w.push('description >4096');
  (e.fields || []).forEach((f) => { if (!f.value || !f.name) w.push('empty field'); else if (f.value.length > 1024) w.push('field value >1024'); });
  if ((e.description || '').split('\n').some((l) => l.length > 70 && !/\]\(/.test(l))) w.push('long line >70 chars');
  if (/[■-◿▀-▟]{3,}/.test(e.description || '')) w.push('bar glyphs render at uneven widths across fonts/mobile');
  if ((e.color ?? 0) === 0xffffff) w.push('white colour bar (#ffffff): looks unset on light theme');
  if (!e.footer) w.push('no footer');
  return w;
}

function rowsHtml(rows) {
  return rows.map((r) => `<div class="row">${(r.components || []).map((c) => c.type === 3
    ? `<span class="btn" style="min-width:300px;justify-content:space-between">${esc(c.placeholder || 'Select')}<span>v</span></span>`
    : `<span class="btn s${c.style}" data-disabled="${c.disabled ? 1 : 0}">${c.emoji?.name ? esc(c.emoji.name) : ''}${esc(c.label || '')}${c.style === 5 ? ' ↗' : ''}</span>`).join('')}</div>`).join('');
}

document.getElementById('root').innerHTML = SCENES.map((sc) => `
  <section class="scene">
    <h2>${esc(sc.title)}</h2><p class="note">${esc(sc.note || '')}</p>
    ${sc.messages.length ? sc.messages.map((m) => {
      const lints = [...new Set(m.embeds.flatMap(lint))];
      return `
      <div class="msg"><div class="av">S</div>
        <div class="who">mofu<span class="app">APP</span><time>Today at 4:20 PM</time></div>
        ${m.embeds.map(embedHtml).join('')}${rowsHtml(m.components)}
        ${lints.length ? `<p class="lint">lint: ${lints.map(esc).join(' | ')}</p>` : ''}
      </div>`;
    }).join('') : '<div class="fail">No render: see note.</div>'}
  </section>`).join('');
</script>
